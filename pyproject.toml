[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moneta"
version = "0.1.0"
description = "High-performance, fixed-point multi-currency and FX pricing tensor engine based on NumPy. Zero float drift, portfolio revaluation, and banking-grade precision."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tony" }
]
keywords = [
    "finance", "currency", "money", "forex", "exchange-rate",
    "fixed-point", "numpy", "quant", "portfolio"
]
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
pandas = [
    "pandas>=1.5.0",
]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme",
    "myst-parser>=3.0",
    "sphinx-copybutton",
    "jieba",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# 只开查错类规则：F（未定义名称、未使用导入等）、E9（语法错误）、B（常见陷阱）
select = ["F", "E9", "B"]

[tool.ruff.lint.per-file-ignores]
# with pytest.raises(...) 中故意写的比较与表达式（如 a < b、-big），用来验证会报错
"tests/**" = ["B015", "B018"]
# 专门测试子模块能否直接导入，导入后不使用是有意的
"tests/test_modules.py" = ["F401"]

[tool.hatch.build.targets.wheel]
packages = ["src/moneta"]
